# Builds the release binaries and publishes them as a GitHub release:
#  - every merged pull request makes a semantic-version release: the
#    push to master it causes gets the next version tag (v0.0.1 first)
#    and its release. The PR's label picks the bump: semver:major,
#    semver:minor, semver:patch (the default without a label) or
#    semver:skip (no release); see .github/scripts/next-version.sh.
#    Commits pushed to master without a PR are not released;
#  - pushing a tag v* by hand (git tag v1.2.3 && git push origin v1.2.3)
#    still creates the release for that tag;
#  - every push to master updates the "nightly" pre-release, so the latest
#    build is always downloadable for testing.
#
# The build job runs the tests and builds with a read-only token and
# without persisted git credentials; only the publish job, which runs no
# project code, can write (and attests the binaries' build provenance).
# A release is only made once the tests pass; if they fail, the next
# merge's release includes the PR (the version covers all PRs merged
# since the last release tag).
# Third-party actions are pinned by commit (the comment names the tag).

name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time and never cancelled half-way, so that two
# merges in quick succession cannot pick the same version. A queued run
# superseded by a newer one is covered by that one's release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the merged PRs' semver labels
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the version in the file names
          persist-credentials: false
      - name: Next version
        id: version
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/next-version.sh "$GITHUB_SHA"
      # Only local (this job cannot push): make dist names the files
      # after it. The publish job pushes the tag.
      - name: Tag the version
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git tag -f "$VERSION" "$GITHUB_SHA"
      # The newest 1.27 patch release (security fixes) rather than the
      # minimum in go.mod's go line.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Install mosquitto (end-to-end tests)
        run: sudo apt-get update && sudo apt-get install -y mosquitto
      # Ubuntu 26.04 confines mosquitto with an AppArmor profile that only
      # lets it read its config from /etc/mosquitto; the tests start it with
      # a config in t.TempDir(). Unload the profile on the runner.
      - name: Unconfine mosquitto (AppArmor)
        run: |
          ls /etc/apparmor.d | grep -i mosquitto || true
          for p in /etc/apparmor.d/*mosquitto*; do
            [ -f "$p" ] && sudo apparmor_parser -R "$p" || true
          done
      - name: Test
        run: go vet ./... && go test -race ./...
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build
        run: make dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestations of the release binaries (verify
      # with: gh attestation verify <file> -R <owner>/<repo>).
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "hmbridge $GITHUB_REF_NAME" --generate-notes --verify-tag
      # Pushing the version tag and moving the nightly tag need git
      # credentials: only this checkout has them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.ref == 'refs/heads/master'
        with:
          path: src
      # A tag pushed with this job's token starts no further workflow
      # run, so the tag trigger above does not release it a second time.
      - name: Publish semver release
        if: github.ref == 'refs/heads/master' && needs.build.outputs.release == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PREVIOUS: ${{ needs.build.outputs.previous }}
        run: |
          set -eo pipefail
          # Push the tag unless a re-run already did; never move it.
          remote=$(git -C src ls-remote origin "refs/tags/$VERSION" | cut -f1)
          if [ -z "$remote" ]; then
            git -C src tag "$VERSION" "$GITHUB_SHA"
            git -C src push origin "refs/tags/$VERSION"
          elif [ "$remote" != "$GITHUB_SHA" ]; then
            echo "::error::tag $VERSION already exists on $remote, not on $GITHUB_SHA"
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            args=(--title "hmbridge $VERSION" --generate-notes --verify-tag --latest)
            if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "$PREVIOUS"); fi
            gh release create "$VERSION" dist/* "${args[@]}"
          fi
          echo "Released [$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION)" >>"$GITHUB_STEP_SUMMARY"
      - name: Publish nightly pre-release
        if: github.ref == 'refs/heads/master'
        run: |
          set -eo pipefail
          git -C src tag -f nightly "$GITHUB_SHA"
          title="hmbridge nightly (${GITHUB_SHA::7})"
          notes="Automatic build of master at ${GITHUB_SHA}. Not a stable release."
          # Create the release once (its tag must exist for that);
          # afterwards only replace its assets.
          if ! gh release view nightly >/dev/null 2>&1; then
            git -C src push -f origin nightly
            gh release create nightly --prerelease --verify-tag --title "$title" --notes "$notes"
          fi
          gh release upload nightly dist/* --clobber
          # The file names contain the version: remove the previous build's.
          gh release view nightly --json assets --jq '.assets[].name' | while read -r name; do
            if [ ! -e "dist/$name" ]; then
              gh release delete-asset nightly "$name" --yes
            fi
          done
          # Move the tag only once the assets match it.
          git -C src push -f origin nightly
          gh release edit nightly --prerelease --title "$title" --notes "$notes"
