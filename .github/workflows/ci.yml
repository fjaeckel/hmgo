# Third-party actions are pinned by commit (the comment names the tag);
# update both together.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The newest 1.27 patch release (security fixes) rather than the
      # minimum in go.mod's go line.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - name: Install mosquitto (end-to-end tests)
        run: sudo apt-get update && sudo apt-get install -y mosquitto
      # Ubuntu 26.04 confines mosquitto with an AppArmor profile that only
      # lets it read its config from /etc/mosquitto; the tests start it with
      # a config in t.TempDir(). Unload the profile on the runner.
      - name: Unconfine mosquitto (AppArmor)
        run: |
          ls /etc/apparmor.d | grep -i mosquitto || true
          for p in /etc/apparmor.d/*mosquitto*; do
            [ -f "$p" ] && sudo apparmor_parser -R "$p" || true
          done
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build release binaries
        run: make dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hmbridge-binaries
          path: dist/
